name: build

# 26.04: builds the DKMS backport against the newest 7.0 kernel, the same way DKMS does on a laptop.
# 26.10: checks that the newest 7.3+ kernel still ships the driver this repo relies on.
# The "proposed" job tests kernels that have not yet reached users, so a breaking Ubuntu update
# shows up here before apt installs it.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1,4"   # Mondays and Thursdays

permissions:
  contents: read

defaults:
  run:
    shell: bash   # explicit "bash" makes GitHub run with -eo pipefail

jobs:
  build:
    name: 26.04 backport build (${{ matrix.pocket }})
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        pocket: [updates, proposed]
    steps:
      - uses: actions/checkout@v5

      - name: Enable resolute-proposed
        if: matrix.pocket == 'proposed'
        run: |
          cat > /etc/apt/sources.list.d/proposed.sources <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: resolute-proposed
          Components: main
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      - name: Pick the newest 7.0 kernel
        id: k
        run: |
          apt-get update -q
          V=$(apt-cache madison linux-source-7.0.0 | awk '{print $3}' | sort -V | tail -n1)
          [ -n "$V" ] || { echo "linux-source-7.0.0 not found"; exit 1; }
          ABI=${V#7.0.0-}; ABI=${ABI%%.*}
          echo "version=$V" >>"$GITHUB_OUTPUT"
          echo "kver=7.0.0-$ABI-generic" >>"$GITHUB_OUTPUT"
          echo "### ${{ matrix.pocket }}: linux $V (7.0.0-$ABI-generic)" >>"$GITHUB_STEP_SUMMARY"

      - name: Install kernel source, headers and toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y -q --no-install-recommends \
            "linux-source-7.0.0=${{ steps.k.outputs.version }}" \
            "linux-headers-${{ steps.k.outputs.kver }}=${{ steps.k.outputs.version }}" \
            gcc make patch bzip2 kmod libc6-dev
          grep CONFIG_CC_VERSION_TEXT "/usr/src/linux-headers-${{ steps.k.outputs.kver }}/.config"
          gcc --version | head -n1

      - name: prepare.sh (DKMS PRE_BUILD)
        id: prep
        run: |
          cp -r dkms /tmp/build
          set +e
          bash /tmp/build/prepare.sh "${{ steps.k.outputs.kver }}" 2>/tmp/prep.err
          rc=$?
          set -e
          cat /tmp/prep.err
          if [ $rc -eq 77 ] && grep -q "already has AW88399 HDA support" /tmp/prep.err; then
            echo "::notice::This kernel ships mainline AW88399 support, so the package correctly declines to build."
            echo "skip=yes" >>"$GITHUB_OUTPUT"
            echo "Kernel already has mainline support. Build skipped by design." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ $rc -eq 0 ] || { echo "::error::prepare.sh refused this kernel (exit $rc). See the message above."; exit 1; }
          echo "skip=no" >>"$GITHUB_OUTPUT"

      - name: Build modules
        if: steps.prep.outputs.skip == 'no'
        run: |
          make -C /tmp/build KVER="${{ steps.k.outputs.kver }}" KDIR="/usr/src/linux-headers-${{ steps.k.outputs.kver }}" 2>&1 | tee /tmp/make.log
          if grep -E "WARNING: .*undefined!" /tmp/make.log; then echo "::error::undefined symbols"; exit 1; fi
          for m in snd-hda-codec-alc269 snd-soc-aw88399-lib snd-hda-scodec-aw88399-legion; do
            vm=$(modinfo -F vermagic "/tmp/build/$m.ko")
            echo "$m: $vm"
            [ "${vm%% *}" = "${{ steps.k.outputs.kver }}" ] || { echo "::error::vermagic mismatch for $m"; exit 1; }
          done
          echo "Built 3 modules OK." >>"$GITHUB_STEP_SUMMARY"

  # Ubuntu 26.10 (kernel 7.3+) uses the kernel's own driver. This repo only supplies the tuning file.
  # This job checks the newest 26.10 kernel for three things that would break that: the driver is
  # gone, the Legion codec fixup is gone, or the driver requests a firmware name install.sh doesn't
  # provide.
  stock:
    name: 26.10 stock driver (${{ matrix.pocket }})
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    strategy:
      fail-fast: false
      matrix:
        pocket: [updates, proposed]
    steps:
      - name: Enable stonking-proposed
        if: matrix.pocket == 'proposed'
        run: |
          cat > /etc/apt/sources.list.d/proposed.sources <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: stonking-proposed
          Components: main
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      - name: Download the newest kernel's modules
        id: k
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends kmod zstd binutils
          V=$(apt-cache madison linux-image-generic | awk '{print $3}' | sort -V | tail -n1)
          ABI=${V%.*}                                   # 7.3.0-10.10 -> 7.3.0-10
          K="$ABI-generic"
          echo "### ${{ matrix.pocket }}: linux $V ($K)" >>"$GITHUB_STEP_SUMMARY"
          cd /tmp && apt-get download "linux-modules-$K=$V"
          dpkg-deb -x /tmp/linux-modules-"$K"_*.deb /tmp/m
          echo "kver=$K" >>"$GITHUB_OUTPUT"

      - name: Check driver, fixup and firmware name
        run: |
          # 26.10 packages modules under /usr/lib/modules (usr-merge); older releases used /lib/modules.
          D=
          for c in /tmp/m/usr/lib/modules /tmp/m/lib/modules; do
            [ -d "$c/${{ steps.k.outputs.kver }}/kernel/sound" ] && { D="$c/${{ steps.k.outputs.kver }}/kernel/sound"; break; }
          done
          [ -n "$D" ] || { echo "::error::no kernel/sound directory in the modules package"; exit 1; }
          SC=$(ls $D/hda/codecs/side-codecs/snd-hda-scodec-aw88399.ko* 2>/dev/null) ||
            { echo "::error::snd-hda-scodec-aw88399 is missing from this kernel"; exit 1; }
          ls $D/hda/codecs/side-codecs/snd-hda-scodec-aw88399-i2c.ko* >/dev/null ||
            { echo "::error::snd-hda-scodec-aw88399-i2c is missing"; exit 1; }
          ALC=$(ls $D/hda/codecs/realtek/snd-hda-codec-alc269.ko*)
          zstdcat -f "$ALC" | strings | grep -qx alc287_fixup_legion_16iax10h_aw88399 ||
            { echo "::error::the Legion AW88399 codec fixup is missing from snd-hda-codec-alc269"; exit 1; }
          FWS=$(modinfo -F firmware "$SC")
          echo "driver requests: $FWS" | tee -a "$GITHUB_STEP_SUMMARY"
          for f in $FWS; do
            case "$f" in
              aw88399_acf.bin|awinic/aw88399_acf_*.bin) ;;   # installed by install.sh
              *) echo "::warning::new firmware name '$f'. install.sh adds plain names automatically; check the README." ;;
            esac
          done

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify linux-firmware still ships the expected tuning files
        run: |
          SHA=1e927c9bca76d868181c0f81df2bccef3cf19c7d0910219f229360c87babd42c
          for n in 17aa3907 17aa3906; do
            curl -fsSL -o "/tmp/$n.bin" "https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/awinic/aw88399_acf_$n.bin"
            echo "$SHA  /tmp/$n.bin" | sha256sum -c -
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -S warning scripts/*.sh system/*.sh dkms/prepare.sh
